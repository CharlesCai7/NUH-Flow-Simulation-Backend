<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emergency Department Simulator — Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="nuhs.css">
<style>
/* ---------- left rail: plan tools ---------- */
.tools{display:flex; flex-direction:column; gap:10px}
.tool{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:var(--panel-raised); border:1px solid var(--border); border-radius:var(--r);
  padding:14px 14px; color:var(--text); font:600 13.5px/1 var(--ui); cursor:pointer;
}
.tool:hover:not(:disabled){border-color:#31567A; background:#16314B}
.tool.active{border-color:var(--nuhs-blue); background:#12324E; box-shadow:var(--glow-accent)}
.tool:disabled{opacity:.35; cursor:default}
.tool .ico{
  width:28px; height:28px; flex:none; border-radius:6px; background:#0B1E33;
  display:grid; place-items:center; color:var(--nuhs-cyan);
}
.tool.active .ico{background:rgba(26,131,212,.18)}
.tool .ico svg{width:16px; height:16px; display:block}

/* ---------- stage ---------- */
.stagepanel{flex:1; min-height:0; position:relative; overflow:hidden}
#canvas{display:block; width:100%; height:100%; touch-action:none}

/* floating view toolbar, top-right of the stage */
.viewbar{
  position:absolute; top:14px; right:14px; z-index:12; display:flex; align-items:center;
  gap:6px; background:var(--panel-deep); border:1px solid var(--border);
  border-radius:10px; padding:6px; box-shadow:0 8px 24px rgba(0,0,0,.45);
}
.vbtn{
  width:32px; height:32px; display:grid; place-items:center; border-radius:6px;
  background:none; border:1px solid transparent; color:var(--text-dim); cursor:pointer;
}
.vbtn:hover{background:var(--panel-raised); color:var(--text)}
.vbtn.active{background:rgba(26,131,212,.2); border-color:var(--nuhs-blue); color:var(--text)}
.vbtn svg{width:16px; height:16px; display:block}
.viewbar .zoom{width:120px; margin:0 2px}
.viewbar .sep{width:1px; height:22px; background:var(--border); margin:0 2px}

/* eye dropdown */
.eyewrap{position:relative}
.eyemenu{
  position:absolute; top:38px; right:0; width:180px; background:var(--panel-deep);
  border:1px solid var(--border); border-radius:8px; padding:8px;
  box-shadow:0 14px 36px rgba(0,0,0,.5); z-index:20;
}
.eyemenu[hidden]{display:none}
.eyemenu .chk{padding:7px 8px; border-radius:5px}
.eyemenu .chk:hover{background:var(--panel-raised)}
.eyemenu hr{border:0; border-top:1px solid var(--border-soft); margin:6px 4px}

/* draw-mode toolbar, top-centre */
.drawbar{
  /* second row, clear of the view toolbar above it */
  position:absolute; top:60px; left:50%; transform:translateX(-50%); z-index:14;
  display:flex; align-items:center; gap:10px; background:var(--panel-deep);
  border:1px solid var(--nuhs-blue); border-radius:10px; padding:8px 12px;
  box-shadow:var(--glow-accent);
}
.drawbar[hidden]{display:none}
.drawbar .title{
  font:700 11px/1 var(--ui); letter-spacing:.1em; text-transform:uppercase; color:var(--text);
}
.drawbar .opt{
  display:flex; align-items:center; gap:7px; height:32px; padding:0 12px;
  border-radius:6px; background:var(--panel-raised); border:1px solid var(--border);
  color:var(--text-dim); font:600 12px/1 var(--ui); cursor:pointer;
}
.drawbar .opt:hover:not(:disabled){color:var(--text); border-color:#31567A}
.drawbar .opt.active{background:rgba(26,131,212,.2); border-color:var(--nuhs-blue); color:var(--text)}
.drawbar .opt:disabled{opacity:.4; cursor:default}
.drawbar .opt svg{width:15px; height:15px}
.drawbar .cancel{width:32px; padding:0; justify-content:center}
.drawbar .steps{
  font:400 12px/1.65 var(--ui); color:var(--text-dim); text-align:left; margin:0;
  padding-left:2px; white-space:nowrap;
}
.drawbar .steps b{color:var(--text); font-weight:600}
.drawbar .head{display:flex; align-items:center; gap:10px}
.drawbar.stack{flex-direction:column; align-items:stretch; gap:8px; padding:12px 14px}
.drawbar.stack .head{justify-content:space-between; gap:14px}

/* step coach */
.coach{
  position:absolute; z-index:16; width:330px; background:var(--panel-deep);
  border:1px solid var(--border); border-radius:10px; padding:18px;
  box-shadow:0 18px 48px rgba(0,0,0,.55); top:110px; right:26px;
}
.coach[hidden]{display:none}
.coach .eyebrow{
  font:700 10.5px/1 var(--ui); letter-spacing:.1em; text-transform:uppercase;
  color:var(--nuhs-cyan); margin:0 0 10px;
}
.coach h3{font-size:18px; font-weight:700; margin:0 0 8px}
.coach p{margin:0; font-size:13px; color:var(--text-dim); line-height:1.55}
.coach .row{display:flex; gap:8px; margin-top:16px}
.coach .row .btn{flex:1}

/* empty state */
.empty{position:absolute; inset:0; display:grid; place-items:center; z-index:10; padding:24px}
.empty[hidden]{display:none}
.emptybox{
  width:min(460px,100%); background:var(--panel-deep); border:1px solid var(--border);
  border-radius:12px; padding:28px; text-align:center; box-shadow:0 20px 56px rgba(0,0,0,.5);
}
.emptybox h3{font-size:22px; font-weight:400; margin-bottom:14px}
.emptybox ol{
  text-align:left; margin:0 0 22px; padding-left:20px; color:var(--text-dim);
  font-size:13.5px; line-height:2;
}
.emptybox .row{display:flex; gap:10px}
.emptybox .row .btn{flex:1}

/* HUD */
.hud{
  position:absolute; left:14px; bottom:14px; z-index:12; display:flex; gap:14px;
  align-items:center; background:var(--panel-deep); border:1px solid var(--border);
  border-radius:8px; padding:7px 12px; font-family:var(--mono); font-size:11.5px;
  color:var(--text-dim);
}
.hud b{color:var(--text); font-weight:600}

/* ---------- right rail ---------- */
.rail-r{position:relative}
/* roles mode has no list, so properties takes the whole rail */
.rail-r.solo #rrtop, .rail-r.solo #vsplit{display:none}
.rail-r.solo #rrbot{flex:1}
.rrtop{flex:none; display:flex; flex-direction:column; min-height:120px; overflow:hidden}
.rrbot{flex:1; min-height:100px; overflow:auto}
.vsplit{
  flex:none; height:9px; cursor:row-resize; position:relative;
}
.vsplit::after{
  content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:34px; height:3px; border-radius:2px; background:var(--border);
}
.vsplit:hover::after{background:var(--nuhs-blue)}
.hsplit{
  position:absolute; left:-12px; top:0; bottom:0; width:10px; cursor:col-resize; z-index:30;
}
.hsplit::after{
  content:""; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:3px; height:34px; border-radius:2px; background:var(--border);
}
.hsplit:hover::after{background:var(--nuhs-blue)}

.tabs2{display:flex; flex:none; border-bottom:1px solid var(--border)}
.tab2{
  flex:1; padding:13px 8px; background:none; border:0; border-bottom:2px solid transparent;
  color:var(--text-dim); font:600 12.5px/1 var(--ui); cursor:pointer;
}
.tab2:hover{color:var(--text)}
.tab2.active{color:var(--text); border-bottom-color:var(--nuhs-cyan); background:rgba(26,131,212,.08)}

.listwrap{flex:1; overflow:auto; padding:12px}
.additem{width:100%; margin-bottom:10px}

.item{
  display:flex; align-items:center; gap:10px; width:100%; padding:10px 10px;
  background:var(--panel-raised); border:1px solid transparent; border-radius:7px;
  color:var(--text); font:400 13px/1.3 var(--ui); cursor:pointer; margin-bottom:6px;
  text-align:left;
}
.item:hover, .item.hov{border-color:#31567A; background:#16314B}
.item.sel{border-color:var(--nuhs-blue); background:#12324E}
.item .sw{width:11px; height:11px; border-radius:3px; flex:none}
.item .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item .sub{display:block; font-size:11px; color:var(--text-dim)}
.item .rn{
  flex:none; font:600 10.5px/1 var(--ui); color:var(--text-dim); background:none;
  border:1px solid var(--border); border-radius:4px; padding:4px 8px; cursor:pointer;
}
.item .rn:hover{color:var(--text); border-color:var(--nuhs-blue)}
.item .roleico{width:20px; height:20px; flex:none}
.emptylist{color:var(--text-faint); font-size:12.5px; padding:14px 4px; margin:0}

.props{padding:16px}
.props .stat{font-family:var(--mono); font-size:12px; color:var(--text-dim); margin:10px 0 0}
.props .stat b{color:var(--text)}

/* colour editor */
.colorbtn{
  width:100%; height:34px; border-radius:6px; border:1px solid var(--border); cursor:pointer;
}
.colorbox{
  margin-top:10px; border:1px solid var(--border); border-radius:8px; padding:12px;
  background:#0A1A2C;
}
.colorbox[hidden]{display:none}
.colorbox .sat{width:100%; height:74px; border-radius:6px; border:1px solid var(--border); cursor:crosshair}
.rgbgrid{display:grid; grid-template-columns:auto 1fr auto 1fr; gap:8px 10px; align-items:center; margin:12px 0}
.rgbgrid label{font:600 11px/1 var(--ui); color:var(--text-dim)}
.rgbgrid input{padding:6px 8px; font-family:var(--mono); font-size:12px; text-align:right}

/* sections list */
.sections{margin-top:6px}
.secrow{
  display:flex; align-items:center; gap:10px; padding:9px 0;
  border-top:1px solid var(--border-soft); font-size:12.5px; color:var(--text-dim);
}
.secrow .lbl{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.secrow input{width:64px; flex:none; padding:5px 7px; font-family:var(--mono);
  font-size:12px; text-align:right}
.secrow.total{border-top:1px solid var(--border); color:var(--text); font-weight:600;
  font-family:var(--mono); padding-top:11px}

/* ---------- roles grid ---------- */
.rolesgrid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:16px; padding:24px;
  align-content:start; overflow:auto; flex:1; min-height:0;
}
.rolesgrid[hidden]{display:none}
.rolecard{
  background:var(--panel-raised); border:1px solid var(--border); border-radius:10px;
  padding:22px 16px; text-align:center; cursor:pointer; display:flex;
  flex-direction:column; align-items:center; gap:12px; min-height:210px;
  justify-content:center;
}
.rolecard:hover{border-color:#31567A}
.rolecard.sel{border-color:var(--nuhs-blue); background:#12324E; box-shadow:var(--glow-accent)}
.rolecard .glyph{width:88px; height:88px; flex:none}
.rolecard .nm{font-size:16px; font-weight:700}
.rolecard .ct{font-family:var(--mono); font-size:13px; color:var(--nuhs-cyan)}

/* tinted PNG glyphs: the assets are white on transparent, so mask them */
.glyph{
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  -webkit-mask-position:center; mask-position:center;
  -webkit-mask-size:contain; mask-size:contain;
  background-color:currentColor;
}

/* settings screen reuses the shell modal; nothing extra needed */

@media (max-width:1180px){
  .rolesgrid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <div class="cols">

    <aside class="rail-l">
      <div class="panel pad">
        <div class="panel-h">Plan tools</div>
        <div class="tools">
          <button class="tool" id="t-zones" data-mode="zones" type="button" disabled>
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.6" fill="currentColor" stroke="none"/>
              <circle cx="15.5" cy="15" r="1.6" fill="currentColor" stroke="none"/></svg></span>
            Edit Zones/Nodes
          </button>
          <button class="tool" id="t-routes" data-mode="routes" type="button" disabled>
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c3.5 0 3.5-10 7-10s3.5 10 7 10 4-3 4-3"/>
              <circle cx="3" cy="17" r="1.8" fill="currentColor" stroke="none"/></svg></span>
            Edit Routes
          </button>
          <button class="tool" id="t-roles" data-mode="roles" type="button" disabled>
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/>
              <path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg></span>
            Edit Roles
          </button>
          <button class="tool" id="t-scale" data-mode="scale" type="button" disabled>
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18"/><path d="M3 8v8"/>
              <path d="M21 8v8"/><path d="M8.5 10v4"/><path d="M15.5 10v4"/></svg></span>
            Set Scale
          </button>
        </div>
      </div>

      <div class="panel pad" id="mapblock" style="display:none">
        <div class="panel-h">Floorplan</div>
        <div class="item" style="cursor:default">
          <span class="nm mono" id="map-name" style="font-size:12px">template_map.png</span>
          <button class="rn" id="btn-replace" type="button">Replace</button>
        </div>
        <div class="ctlrow" style="margin-top:12px">
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:6px">
            <span>Opacity</span><span class="mono" id="op-val">100%</span>
          </div>
          <input type="range" id="map-opacity" min="10" max="100" value="100">
        </div>
        <div style="margin-top:12px;font-size:12px;color:var(--text-dim)" id="scale-readout">
          Scale not set &mdash; distances shown in pixels.
        </div>
      </div>
    </aside>

    <main class="stage">
      <section class="panel stagepanel" id="stagepanel">
        <canvas id="canvas"></canvas>

        <div class="viewbar" id="viewbar" hidden>
          <button class="vbtn active" id="v-select" title="Select" type="button">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 8.2-6.1 1.3 2.6 6.2-2.6 1.1-2.6-6.2L5 18z"/></svg>
          </button>
          <button class="vbtn" id="v-pan" title="Pan" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 013 0V11m0-1.5a1.5 1.5 0 013 0V12m0-1a1.5 1.5 0 013 0v4.5c0 3-2.4 5.5-5.5 5.5S8 18.5 8 15.5V14l-1.9-2.2a1.5 1.5 0 012.2-2L9 11"/></svg>
          </button>
          <span class="sep"></span>
          <button class="vbtn" id="v-zoomout" title="Zoom out" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6M8 11h6"/></svg>
          </button>
          <input type="range" class="zoom" id="v-zoom" min="50" max="200" value="100" aria-label="Zoom">
          <button class="vbtn" id="v-zoomin" title="Zoom in" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6M8 11h6M11 8v6"/></svg>
          </button>
          <span class="sep"></span>
          <span class="eyewrap">
            <button class="vbtn" id="v-eye" title="Layers" type="button" aria-haspopup="true" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M1.6 12S5.2 5.5 12 5.5 22.4 12 22.4 12 18.8 18.5 12 18.5 1.6 12 1.6 12z"/>
                <circle cx="12" cy="12" r="2.8"/></svg>
            </button>
            <div class="eyemenu" id="eyemenu" hidden>
              <label class="chk"><input type="checkbox" id="lay-zones" checked> Zones</label>
              <label class="chk"><input type="checkbox" id="lay-nodes" checked> Nodes</label>
              <label class="chk"><input type="checkbox" id="lay-routes" checked> Routes</label>
              <label class="chk"><input type="checkbox" id="lay-grid"> Gridlines</label>
              <hr>
              <label class="chk"><input type="checkbox" id="lay-all"> Show all</label>
            </div>
          </span>
        </div>

        <div class="drawbar" id="drawbar" hidden>
          <div class="head">
            <span class="title" id="draw-title">Add Zone</span>
            <button class="opt" id="draw-a" type="button"></button>
            <button class="opt" id="draw-b" type="button"></button>
            <button class="opt cancel" id="draw-x" type="button" title="Cancel">&times;</button>
          </div>
          <p class="steps" id="draw-steps" hidden></p>
        </div>

        <div class="coach" id="coach" hidden>
          <p class="eyebrow" id="coach-eyebrow">Step 1 of 4</p>
          <h3 id="coach-title">Add a zone</h3>
          <p id="coach-body"></p>
          <div class="row">
            <button class="btn" id="coach-skip" type="button">Skip</button>
            <button class="btn primary" id="coach-go" type="button">Add zone</button>
          </div>
        </div>

        <div class="hud" id="hud" hidden>
          <b id="hud-mode">select</b><span id="hud-zoom">100%</span><span id="hud-extra"></span>
        </div>

        <div class="empty" id="empty">
          <div class="emptybox">
            <h3>Get started</h3>
            <ol>
              <li>Upload a floorplan</li>
              <li>Set the scale</li>
              <li>Draw routes, add details</li>
            </ol>
            <div class="row">
              <button class="btn primary" id="btn-upload" type="button">Upload map</button>
              <button class="btn" id="btn-skip" type="button">Skip</button>
            </div>
          </div>
        </div>
      </section>

      <div class="rolesgrid panel" id="rolesgrid" hidden></div>
    </main>

    <aside class="rail-r" id="railr">
      <div class="hsplit" id="hsplit" title="Drag to resize"></div>

      <div class="panel flex rrtop" id="rrtop">
        <div class="tabs2" id="rrtabs">
          <button class="tab2 active" data-tab="zones" type="button">Zones</button>
          <button class="tab2" data-tab="nodes" type="button">Nodes</button>
        </div>
        <div class="listwrap" id="listwrap"></div>
      </div>

      <div class="vsplit" id="vsplit" title="Drag to resize"></div>

      <div class="panel rrbot" id="rrbot">
        <div class="panel-h" id="props-title">Properties</div>
        <div class="props" id="props"></div>
      </div>
    </aside>

  </div>
</div>

<input type="file" id="fileInput" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
<input type="file" id="importInput" accept="application/json,.json" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">

<script src="nuhs-shell.js"></script>
<script src="plan.js"></script>
</body>
</html>
